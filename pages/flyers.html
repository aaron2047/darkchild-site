<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Flyers · Ms. Darkchild</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C9A84C;
      --black: #0a0a0a;
      --surface: #141414;
      --card: #1a1a1a;
      --border: rgba(201,168,76,0.2);
      --text: #f0ece0;
      --muted: #777;
    }

    body {
      background: var(--black);
      color: var(--text);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
    }

    /* NAV — matches the main site style */
    .page-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
    }

    .nav-back {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
      text-decoration: none;
    }

    .nav-back:hover { opacity: 0.7; }

    .nav-title {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* HERO */
    .page-hero {
      text-align: center;
      padding: 4rem 2rem 2rem;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.75rem;
    }

    .page-hero h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 0.75rem;
    }

    .page-hero p {
      font-size: 14px;
      color: var(--muted);
      max-width: 360px;
      margin: 0 auto 2rem;
    }

    /* FILTER BAR */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 0 1rem 2.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.2s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(201,168,76,0.06);
    }

    /* FLYER GRID */
    .flyers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.25rem;
      padding: 0 2rem 4rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .flyer-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
    }

    .flyer-card:hover {
      transform: translateY(-3px);
      border-color: rgba(201,168,76,0.5);
    }

    .flyer-card img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      display: block;
    }

    .flyer-card-info {
      padding: 10px 12px;
    }

    .flyer-name {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .flyer-card .share-bar {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      border-top: 1px solid var(--border);
    }

    .share-btn {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 4px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.2s;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .share-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    /* LIGHTBOX */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .lightbox.open { display: flex; }

    .lightbox-inner {
      position: relative;
      max-width: min(90vw, 520px);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }

    .lightbox img {
      width: 100%;
      max-height: 75vh;
      object-fit: contain;
      border-radius: 8px;
    }

    .lightbox-close {
      position: absolute;
      top: -14px;
      right: -14px;
      background: var(--gold);
      color: #000;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      line-height: 1;
    }

    .lightbox-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .lightbox-btn {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: opacity 0.2s;
    }

    .lightbox-btn:hover { opacity: 0.8; }

    .lb-download {
      background: var(--gold);
      color: #000;
      border: none;
      font-weight: 600;
    }

    .lb-share {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    /* LOADING + EMPTY */
    .state-msg {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
      font-size: 14px;
      grid-column: 1 / -1;
    }

    .state-msg .big { font-size: 2.5rem; margin-bottom: 0.75rem; }

    /* BOOK CTA */
    .book-cta {
      text-align: center;
      padding: 3rem 2rem 5rem;
      border-top: 1px solid var(--border);
    }

    .book-cta p {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.75rem;
    }

    .book-cta h2 {
      font-size: 1.75rem;
      margin-bottom: 1.25rem;
    }

    .book-link {
      display: inline-block;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 12px 28px;
      border-radius: 6px;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.2s;
    }

    .book-link:hover { background: rgba(201,168,76,0.1); }
  </style>
</head>
<body>

<nav class="page-nav">
  <a href="../index.html" class="nav-back">← Ms. Darkchild</a>
  <span class="nav-title">Event Flyers</span>
</nav>

<div class="page-hero">
  <p class="eyebrow">Absolute Soul Entertainment</p>
  <h1>Upcoming Events</h1>
  <p>Download and share flyers to spread the word</p>
</div>

<div class="filter-bar">
  <button class="filter-btn active" onclick="filterFlyers('all', this)">All</button>
  <button class="filter-btn" onclick="filterFlyers('2026', this)">2026</button>
  <button class="filter-btn" onclick="filterFlyers('2025', this)">2025</button>
</div>

<div class="flyers-grid" id="flyers-grid">
  <div class="state-msg">
    <div class="big">🎭</div>
    Loading flyers…
  </div>
</div>

<div class="book-cta">
  <p>Ready to perform at your event?</p>
  <h2>Book Ms. Darkchild</h2>
  <a href="../index.html#booking" class="book-link">Make a Booking Inquiry</a>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <div class="lightbox-inner">
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    <img id="lb-img" src="" alt="Event flyer">
    <div class="lightbox-actions">
      <a id="lb-download" class="lightbox-btn lb-download" download>⬇ Save Flyer</a>
      <button class="lightbox-btn lb-share" onclick="shareFlyer()">Share ↗</button>
    </div>
  </div>
</div>

<script>
const REPO   = 'aaron2047/darkchild-site';
const BRANCH = 'main';
const FOLDER = 'assets/flyers';
const RAW    = `https://raw.githubusercontent.com/${REPO}/${BRANCH}`;
const API    = 'https://api.github.com';

let allFlyers = [];
let currentFilter = 'all';

async function loadFlyers() {
  const grid = document.getElementById('flyers-grid');
  try {
    const res = await fetch(`${API}/repos/${REPO}/contents/${FOLDER}`);
    if (res.status === 404) {
      grid.innerHTML = '<div class="state-msg"><div class="big">📭</div>No flyers posted yet — check back soon!</div>';
      return;
    }
    const files = await res.json();
    allFlyers = files
      .filter(f => /\.(jpg|jpeg|png|webp|gif)$/i.test(f.name))
      .reverse();

    if (!allFlyers.length) {
      grid.innerHTML = '<div class="state-msg"><div class="big">📭</div>Flyers coming soon!</div>';
      return;
    }

    renderFlyers(allFlyers);
  } catch(e) {
    grid.innerHTML = '<div class="state-msg"><div class="big">⚠️</div>Could not load flyers right now. Try refreshing.</div>';
  }
}

function renderFlyers(files) {
  const grid = document.getElementById('flyers-grid');
  if (!files.length) {
    grid.innerHTML = '<div class="state-msg">No flyers for this period yet.</div>';
    return;
  }
  grid.innerHTML = files.map(f => {
    const src = `${RAW}/${f.path}`;
    const label = f.name.replace(/\.[^.]+$/, '').replace(/-/g, ' ');
    return `
      <div class="flyer-card" data-name="${f.name}">
        <img src="${src}" alt="Event flyer" loading="lazy" onclick="openLightbox('${src}', '${f.name}')">
        <div class="flyer-card-info">
          <div class="flyer-name">${label}</div>
        </div>
        <div class="share-bar">
          <a class="share-btn" href="${src}" download="${f.name}">⬇ Save</a>
          <button class="share-btn" onclick="nativeShare('${src}', '${label}')">Share ↗</button>
        </div>
      </div>
    `;
  }).join('');
}

function filterFlyers(year, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = year;
  const filtered = year === 'all'
    ? allFlyers
    : allFlyers.filter(f => f.name.startsWith(year));
  renderFlyers(filtered);
}

function openLightbox(src, name) {
  const lb = document.getElementById('lightbox');
  document.getElementById('lb-img').src = src;
  const dl = document.getElementById('lb-download');
  dl.href = src;
  dl.download = name;
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox(e) {
  if (e && e.target !== document.getElementById('lightbox') && !e.target.classList.contains('lightbox-close')) return;
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLightbox({target: document.getElementById('lightbox')});
});

async function nativeShare(src, name) {
  if (navigator.share) {
    try {
      await navigator.share({ title: `Ms. Darkchild — ${name}`, url: src });
    } catch(_) {}
  } else {
    await navigator.clipboard.writeText(src);
    alert('Flyer link copied to clipboard!');
  }
}

function shareFlyer() {
  const src = document.getElementById('lb-img').src;
  nativeShare(src, 'Event Flyer');
}

loadFlyers();
</script>
</body>
</html>
